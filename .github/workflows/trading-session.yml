name: trading-session

# Self-healing schedule: GitHub cron fires can be delayed or silently
# skipped, so we tick every 30 minutes through the session window
# (08:50-15:20 IST). The concurrency group serialises runs: the first tick
# owns the session, later ticks queue and exit immediately once their
# deadline (12:30 or 15:50 IST by UTC hour) has passed — and if a session
# crashes mid-day, the next tick resumes monitoring within 30 minutes.
#
# NOTE: GitHub's scheduler is still best-effort. Fine for recommend/paper;
# if you go live with real money, prefer an always-on host (see README).
on:
  schedule:
    - cron: "20,50 3-9 * * 1-5"   # every 30 min, 08:50-15:20 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      mode:
        description: "trading mode"
        type: choice
        options: [recommend, paper, live]
        default: paper
      until:
        description: "stop at IST time HH:MM (default: session end)"
        required: false
      oneshot:
        description: "one-shot analysis now (ignores market hours, never orders)"
        type: boolean
        default: false
      verify:
        description: "triangulate one live recommendation (lot size, premiums, margin)"
        type: boolean
        default: false
      simulate_weeks:
        description: "run historical simulation for N weeks instead (e.g. 6)"
        required: false

concurrency:
  group: trading-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore journal/state from bot-state branch
        run: |
          mkdir -p data reports
          if git fetch origin bot-state 2>/dev/null; then
            git checkout origin/bot-state -- data reports 2>/dev/null || true
            echo "state restored"
          else
            echo "no prior state (first run)"
          fi

      - name: Decide session end time
        id: session
        run: |
          UNTIL="${{ inputs.until }}"
          if [ -z "$UNTIL" ]; then
            # before 06:00 UTC => morning session, else afternoon
            if [ "$(date -u +%H)" -lt 6 ]; then UNTIL="12:30"; else UNTIL="15:50"; fi
          fi
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          echo "session ends at $UNTIL IST"

      - name: Run trading session
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADEBOT_MODE: ${{ inputs.mode || vars.TRADEBOT_MODE || 'paper' }}
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.verify }}" = "true" ]; then
            echo "::notice::verify — triangulating a live recommendation"
            python -m tradebot.cli verify
          elif [ -n "${{ inputs.simulate_weeks }}" ]; then
            echo "::notice::historical simulation (${{ inputs.simulate_weeks }} weeks, no orders)"
            python -m tradebot.cli simulate --weeks "${{ inputs.simulate_weeks }}"
          elif [ "${{ inputs.oneshot }}" = "true" ]; then
            echo "::notice::one-shot analysis (no orders, market hours ignored)"
            python -m tradebot.cli recommend
          else
            python -m tradebot.cli run --until "${{ steps.session.outputs.until }}"
          fi

      - name: Persist journal/state to bot-state branch
        if: always()
        run: |
          set -e
          cp data/tradebot.db /tmp/tradebot.db 2>/dev/null || exit 0
          cp -r reports /tmp/reports 2>/dev/null || true
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          if git fetch origin bot-state 2>/dev/null; then
            git checkout -B bot-state origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf -q . || true
          fi
          mkdir -p data reports
          cp /tmp/tradebot.db data/
          cp /tmp/reports/*.md reports/ 2>/dev/null || true
          git add -f data/tradebot.db reports
          git commit -m "bot state $(date -u +%FT%TZ)" || echo "no state change"
          git push -u origin bot-state

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
