# ============================================================
# Trade-bot configuration
# Modes:
#   recommend - analyse market, print/notify trade plans, never place orders
#   paper     - simulated execution with full monitoring (default; run this
#               for at least 4-6 weeks before considering live)
#   live      - real orders via DhanHQ. Use only after paper results satisfy you.
# ============================================================
mode: paper

capital:
  initial: 50000            # INR
  max_capital_per_trade: 40000   # premium/margin budget for any single trade

underlyings:
  - name: NIFTY
    security_id: 13          # Dhan security id for NIFTY 50 index
    segment: IDX_I
    instrument: INDEX
    lot_size: 65             # FALLBACK ONLY — the live value is read from the
                             # Dhan scrip master at runtime (index lot sizes
                             # change; never trust this number for sizing)
    strike_step: 50

risk:
  # Baseline profile, kept after A/B simulation on 2026-06-10: on identical
  # 6-week data the aggressive variant (4.5%/7.5%, target 80, 45-min entry
  # cooldown) returned -8.4% PF 0.83 vs this baseline's +7.1% PF 1.19.
  # Varsity principle applied: size by evidence, not appetite. Re-test with
  # the monthly simulation before changing these.
  max_risk_per_trade_pct: 3.0   # max planned loss per trade, % of capital
  max_daily_loss_pct: 5.0       # kill switch: stop trading for the day
  max_open_positions: 2
  max_trades_per_day: 3
  entry_cooldown_minutes: 0     # off: cooldown cut pyramided trend winners in
                                # testing; feature retained for future A/Bs
  stop_loss_premium_pct: 30     # long options: exit if premium drops 30%
  target_premium_pct: 60        # book at +60% of premium paid
  trail_after_r: 1.0            # start trailing once 1R in profit
  trail_lock_r: 0.5             # lock in 0.5R once trailing starts
  credit_profit_take_pct: 50    # credit spreads: buy back at 50% of max profit
  credit_stop_multiple: 1.5     # credit spreads: exit if loss = 1.5x credit received
  max_spread_width: 300         # max strike width for spreads (points)

schedule:
  timezone: Asia/Kolkata
  premarket_time: "08:50"
  market_open: "09:15"
  no_trade_before: "09:30"      # let opening volatility settle (Varsity guidance)
  last_entry_time: "14:30"
  intraday_squareoff_time: "15:12"
  market_close: "15:30"
  eod_report_time: "15:40"
  signal_interval_minutes: 15
  monitor_interval_seconds: 45

signals:
  direction_threshold: 30        # |score| >= this => directional view
  strong_direction_threshold: 55
  min_confidence: 0.50
  # Volatility regime: IV percentile of India VIX over the trailing year
  # (Varsity's preferred read); falls back to fixed thresholds when history
  # is unavailable.
  use_iv_percentile: true
  vol_percentile_high: 75
  vol_percentile_low: 25
  vix_high: 17.0                 # fixed-threshold fallback
  vix_low: 12.5
  # component weights for the composite direction score (sum need not be 1)
  weights:
    daily_trend: 0.30
    intraday_momentum: 0.25
    option_chain: 0.20
    fii_dii: 0.15
    news: 0.10

execution:
  product_type: INTRADAY         # INTRADAY | MARGIN (positional/overnight)
  order_type: LIMIT              # LIMIT recommended; MARKET allowed
  limit_buffer_pct: 0.5          # cross the spread by this % on limit orders
  avoid_expiry_day_longs_after: "13:30"  # no fresh long-option entries late on expiry day

notifications:
  telegram_enabled: true     # active only when TELEGRAM_* secrets are set

# LLM market analyst (Claude). The LLM forms the market view from the full
# data dossier; deterministic code keeps all risk guardrails. Requires
# ANTHROPIC_API_KEY; fails soft to the quant composite when unavailable.
llm:
  enabled: true
  mode: primary              # primary: LLM view drives decisions (quant logged
                             # for audit) | component: LLM is one weighted input
  component_weight: 0.35     # used only in component mode
  model: claude-opus-4-8
  max_tokens: 16000

# Regime filter: refuse directional entries when the daily chart shows no
# trend (low ADX) or a compressed range — trend systems bleed in chop.
# Iron condors (range-bound playbook) remain allowed. A/B-tested before
# enabling; re-test with the monthly simulation when tuning.
regime:
  enabled: true
  min_daily_adx: 18            # ADX(14) below this => no directional edge
  range_compression_days: 5
  range_compression_pct: 1.2   # N-day range under this % of spot => chop

# Known event days (RBI MPC, Union Budget, election results, Fed/CPI nights
# that gap the open). The bot takes no fresh entries on these dates.
# Maintain this list ~monthly; the LLM analyst also flags event risk from
# headlines when enabled.
events:
  skip_dates: []               # e.g. ["2026-08-06", "2027-02-01"]

paths:
  db: data/tradebot.db
  cache_dir: data/cache
  reports_dir: reports
